[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "narjo-sing-helper"
version = "0.2.0"
description = "Self-hosted vocal separation helper for Narjo's Sing feature"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "starlette>=0.40",
  "uvicorn>=0.30",
  "mutagen>=1.47",
  "numpy>=1.26",
  "soundfile>=0.12",
]

[project.optional-dependencies]
separator = ["audio-separator[cpu]>=0.47", "audioread>=3.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["narjo_sing", "narjo_sing.library"]

[tool.pytest.ini_options]
markers = ["slow: runs a real separation model (downloads weights, takes minutes)"]
addopts = "-m 'not slow'"
